# What Portarr's read-only ServiceAccount needs to read the backups of a cluster: get and list, nothing else
# (no Secrets, no write verb, no volumes). Portarr reads only the namespaces the catalog's references name
# (shop/dump -> shop), so the same rules can be a namespaced Role + RoleBinding in each of those namespaces instead of
# this ClusterRole: a cluster-wide grant would expose the pod templates (and their env values) of every namespace.
# Merge these rules into the role Portarr already uses for its inventory.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portarr-backups-reader
rules:
  - apiGroups: [k8up.io]
    resources: [schedules, backups, snapshots]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portarr-backups-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portarr-backups-reader }
subjects:
  - { kind: ServiceAccount, name: portarr-reader, namespace: portarr }
