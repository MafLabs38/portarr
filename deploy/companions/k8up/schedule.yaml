# One Schedule per namespace: backs up the claims of the namespace (annotated k8up.io/backup=true) and the
# dumps of the pods annotated with k8up.io/backupcommand, to an S3-compatible bucket (Backblaze B2 here).
# Portarr reads the Schedule, its Backups and the Snapshots: catalog `k8up: { schedule: shop/offsite }`.
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: shop
type: Opaque
stringData:                        # create it from your secret manager, not from a file in Git
  repo-password: "<restic repository password>"
  b2-account-id: "<application key id>"
  b2-account-key: "<application key>"
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: offsite
  namespace: shop
spec:
  backend:
    repoPasswordSecretRef: { name: backup-credentials, key: repo-password }
    b2:
      bucket: example-backups
      path: shop
      accountIDSecretRef: { name: backup-credentials, key: b2-account-id }
      accountKeySecretRef: { name: backup-credentials, key: b2-account-key }
  backup:
    schedule: "0 4 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 3
  prune:
    schedule: "0 5 * * 0"
    retention: { keepDaily: 7, keepWeekly: 4, keepMonthly: 12 }
  check:
    schedule: "0 6 1 * *"
