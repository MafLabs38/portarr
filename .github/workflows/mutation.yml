# Weekly mutation testing (Stryker.NET + StrykerJS), from the organization's github-template
# (quality option "mutation"). It measures whether the tests catch injected bugs; it never blocks a PR.
# The score and the surviving mutants go to the job summary; full HTML reports are artifacts.
name: Mutation testing

on:
  schedule:
    - cron: "23 3 * * 6" # Saturday night
  workflow_dispatch:
  # Validate a change of the Stryker configuration itself.
  pull_request:
    paths:
      - ".github/workflows/mutation.yml"
      - "src/**/stryker-config.json"
      - "stryker.config.json"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  stryker-net:
    name: mutation (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Test projects with a stryker-config.json; integration tests are too slow to mutate.
        project: [Portarr.Core.Test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Stryker.NET
        working-directory: src/${{ matrix.project }}
        run: dotnet stryker --reporter markdown --reporter html --reporter progress --output StrykerOutput
      - name: Summary
        if: always()
        run: cat src/${{ matrix.project }}/StrykerOutput/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.project }}
          path: src/${{ matrix.project }}/StrykerOutput/reports/

  stryker-js:
    name: mutation (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: StrykerJS
        run: yarn stryker run --concurrency 4 | tee stryker.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '### Mutation testing (frontend)'
            echo '```'
            grep -E '^(-|File|All files| )' stryker.txt | sed -n '1,60p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-frontend
          path: reports/mutation/
