# Baseline pipeline derived from the organization's github-template (dotnet stack),
# extended for Portarr (React frontend, SQLite/PostgreSQL matrix, E2E, security scans).
# Becomes effective with phase 0 (P0.2–P0.4) of docs/IMPLEMENTATION_PLAN.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  # Skips build and test jobs until phase 0 adds the solution and the frontend,
  # so the pipeline stays green on a docs-only repository.
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        run: |
          if [ -f src/Portarr.sln ] && [ -f package.json ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: dotnet format src/Portarr.sln --verify-no-changes
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn stylelint
      - run: yarn typecheck

  test-backend:
    name: test-backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    env:
      PORTARR_TEST_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/Portarr.sln
      - run: dotnet build src/Portarr.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test src/Portarr.sln --no-build --configuration Release --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./coverage/unit
      - name: Integration tests (Testcontainers)
        run: dotnet test src/Portarr.sln --no-build --configuration Release --filter "Category=Integration" --collect:"XPlat Code Coverage" --results-directory ./coverage/integration
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-${{ matrix.database }}
          path: coverage/

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox
      - name: Build image and start the e2e stack
        run: docker compose -f tests/e2e/stack/docker-compose.yml up -d --build --wait
      - run: yarn e2e --grep @smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: coverage/
      - run: dotnet tool install --global dotnet-sonarscanner
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="coverage/coverage-frontend/lcov.info"
      - run: dotnet build src/Portarr.sln
      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action needs a license key on organization repositories; the CLI does not.
      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose
      - name: Dependency and config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
