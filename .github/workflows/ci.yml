# Baseline pipeline derived from the organization's github-template (dotnet stack),
# extended for Portarr (React frontend, SQLite/PostgreSQL matrix, E2E, security scans).
# Pull requests are built and tested here, but only develop and main publish an image
# (IMPLEMENTATION_PLAN.md §1.3). Releases (semantic-release, multi-arch) come later in P0.4.
name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, including stacked ones whose base is another feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: dotnet format src/Portarr.sln --verify-no-changes
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn stylelint
      - run: yarn format:check
      - run: yarn typecheck

  test-backend:
    name: test-backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    env:
      # Read by the persistence tests once C1 adds the database (TESTING.md §3).
      PORTARR_TEST_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build src/Portarr.sln --configuration Release
      # Exit code 8 means "no test matched the filter" in a project: expected, each project holds one kind.
      - name: Unit tests
        run: >
          dotnet test --solution src/Portarr.sln --configuration Release --no-build --
          --filter-not-trait "Category=Integration" --ignore-exit-code 8
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage/unit"
      - name: Integration tests
        run: >
          dotnet test --solution src/Portarr.sln --configuration Release --no-build --
          --filter-trait "Category=Integration" --ignore-exit-code 8
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage/integration"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-backend-${{ matrix.database }}
          path: coverage/

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/frontend/

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox
      - name: Build the image and start the e2e stack
        run: docker compose -f tests/e2e/stack/docker-compose.yml up -d --build --wait
      - name: Wait for Portarr
        run: timeout 60 bash -c 'until curl -fs http://localhost:8484/api/v1/system/status; do sleep 1; done'
      - run: yarn e2e --grep @smoke
      - if: failure()
        run: docker compose -f tests/e2e/stack/docker-compose.yml logs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  image:
    name: image
    runs-on: ubuntu-latest
    needs: e2e-smoke
    # Integrated code only: pull requests never publish images.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The branch name (develop, main) plus the commit.
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=0.0.0-${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Runs once a SonarQube server is configured (repository variable + secret).
    if: vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          path: coverage/
      - run: dotnet tool install --global dotnet-sonarscanner
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/**/*.xml"
          /d:sonar.javascript.lcov.reportPaths="coverage/coverage-frontend/lcov.info"
      - run: dotnet build src/Portarr.sln
      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action needs a license key on organization repositories; the CLI does not.
      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose
      - name: Dependency and config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
