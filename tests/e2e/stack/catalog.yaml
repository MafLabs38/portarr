# Catalog of the end-to-end stack: one environment read through the socket proxy,
# a healthy web app and a failing optional service.
environments:
  - id: e2e
    name: E2E host
    docker: { url: 'http://socket-proxy:2375' }

stacks:
  - id: demo
    name: Demo
    members:
      - { app: web, role: critical }
      - { app: broken, role: optional }

apps:
  - id: web
    name: Web
    icon: nginx
    urls:
      - { label: Home, href: 'http://localhost:8080' }
    # Portarr runs in the compose network: it reaches the sample app by its service name, `localhost:8080` is only the
    # port published to the browser. Without this the default check on the URL fails and the critical app is Down.
    check: { url: 'http://web' }
    workloads:
      - { runtime: docker@e2e, match: { name: e2e-web } }
  - id: broken
    name: Broken job
    type: service
    workloads:
      - { runtime: docker@e2e, match: { name: e2e-broken } }
  - id: docs
    name: Docs
    urls:
      - { href: 'https://docs.homelab.example' }

# Followed data: what the Data page shows on this stack. A copy made by hand needs no backup tool; the off-site copy
# is declared and nothing produces it yet.
data:
  - id: web-content
    app: web
    name: Web content
    kind: files
    importance: critical
    where: { environment: e2e, workload: e2e-web }
    targets:
      local: { manual: true }
      offsite: {}

# MCP servers and workstations: the stub of the tools container answers `initialize` like an MCP server; nothing listens
# on port 9, so the second one is Down. The two assistants of the workstations are the ones the plan renders for.
mcpServers:
  - id: memory
    name: Memory
    transport: http
    http:
      url: 'http://tools:8080/mcp'
      allowInsecure: true
      headers:
        X-Api-Key: { env: MEMORY_MCP_KEY }
    notes: Long-term memory.
  - id: search
    name: Search
    transport: http
    http: { url: 'http://localhost:9/mcp', allowInsecure: true }
  - id: github
    name: GitHub
    transport: stdio
    stdio:
      command: npx
      args: ['-y', '@example/github-mcp@1.4.2']
      env: { GITHUB_TOKEN: { env: GITHUB_TOKEN } }

workstations:
  - id: dev-laptop
    name: Dev laptop
    os: windows
    clients: [claude-code, cursor]
    mcp:
      - memory
      - { server: github, clients: [claude-code] }
  - id: dev-vm
    name: Dev VM
    os: linux
    clients: [claude-code]
    mcp: [memory]
