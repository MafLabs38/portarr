# End-to-end stack: the Portarr image built from this repository, reading the host's Docker
# through the socket proxy (GET only), with a sample web container and a failing one.
# The socket is mounted into the proxy only: `:ro` does not restrict the Docker API, a direct
# mount would give Portarr root-equivalent access to the host.
name: portarr-e2e

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    image: nginx:stable-alpine-slim
    container_name: e2e-web
    ports:
      - '8080:80'

  # Exits with code 1 once, for the Down/Degraded statuses and the stderr logs.
  broken:
    image: alpine:3.20
    container_name: e2e-broken
    command: ['sh', '-c', 'echo starting; echo fatal error >&2; exit 1']
    restart: 'no'

  portarr:
    build:
      context: ../../..
    depends_on:
      - socket-proxy
      - web
    environment:
      PORTARR__CATALOGFILE: /catalog/catalog.yaml
    ports:
      - '8484:8484'
    volumes:
      - portarr-config:/config
      - ./catalog.yaml:/catalog/catalog.yaml:ro

volumes:
  portarr-config:
